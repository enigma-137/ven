# Builds downloadable binaries and publishes a GitHub release when a
# version tag is pushed:  git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test
        run: go test ./...

      - name: Build dashboard
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}
            name="ven_${VERSION#v}_${os}_${arch}"
            bin=ven; [ "$os" = windows ] && bin=ven.exe
            mkdir -p "build/$name"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X github.com/enigma-137/ven/internal/app.Version=${VERSION}" \
              -o "build/$name/$bin" ./cmd/ven
            cp LICENSE README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          cat > notes.md <<'NOTES'
          Install: https://ven.traceiq.run/docs/#install · Verify downloads with `SHA256SUMS`.
          Code signing policy: https://ven.traceiq.run/code-signing (Windows signing via the SignPath Foundation is being set up).
          NOTES
          gh release create "$VERSION" dist/* --title "VEN $VERSION" --notes-file notes.md --generate-notes $prerelease
